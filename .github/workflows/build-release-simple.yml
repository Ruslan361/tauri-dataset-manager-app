name: Build Release (Simple)

on:
  push:
    branches: [ tauri ]
  workflow_dispatch:

jobs:
  build-linux:
    # ... (код build-linux оставляем без изменений)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'  
          
      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Run build scripts
        run: |
          chmod +x scripts/build-tauri.sh scripts/create-release-scripts.sh
          cd scripts
          ./build-tauri.sh
          ./create-release-scripts.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/linux/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'  
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: dtolnay/rust-toolchain@stable

      - name: Download bundled uv
        shell: pwsh
        run: |
          $zip = "uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/latest/download/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath uv-extracted -Force
          New-Item -ItemType Directory -Force -Path release\windows\tools | Out-Null
          $uvExe = Get-ChildItem uv-extracted -Recurse -Filter uv.exe | Select-Object -First 1
          Copy-Item $uvExe.FullName release\windows\tools\uv.exe
          Remove-Item $zip, uv-extracted -Recurse -Force

      - name: Pre-download Python wheels
        shell: pwsh
        run: |
          $uv = Join-Path $PWD "release\windows\tools\uv.exe"
          New-Item -ItemType Directory -Force -Path release\windows\wheels | Out-Null
          Set-Location backend
          # Обновляем lockfile если устарел, затем экспортируем requirements.txt
          & $uv lock
          & $uv export --frozen --no-hashes --output-file ..\release\windows\requirements.txt
          # Скачиваем prebuilt wheels для win_amd64 под Python 3.10, 3.11, 3.12
          # uv pip download не существует — используем системный pip
          foreach ($pyver in @("3.10", "3.11", "3.12")) {
            python -m pip download `
              -r ..\release\windows\requirements.txt `
              --platform win_amd64 `
              --python-version $pyver `
              --only-binary :all: `
              --dest ..\release\windows\wheels
          }

      - name: Run build scripts
        shell: pwsh
        run: |
          $scriptsPath = Join-Path $PWD "scripts"
          & "$scriptsPath\build-tauri.ps1"
          & "$scriptsPath\create-release-scripts.ps1"
          
      # 1. Устанавливаем Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup
        
      # 2. Компилируем установщик из скрипта
      - name: Build Installer
        run: iscc scripts/installer.iss
      
      # 3. Загружаем portable-версию (папку)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-portable
          path: release/windows/

      # 4. Загружаем сам установщик (setup.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: release/Atrofovizualizatia.exe
